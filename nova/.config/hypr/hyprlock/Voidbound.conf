# =========================================================
# Voidbound Nova — Hyprlock
# =========================================================

background {
    monitor =
    path = $HYPRLOCK_BACKGROUND

    blur_passes = 3
    blur_size = 8

    brightness = 0.48
    contrast = 1.05
    vibrancy = 0.16
    vibrancy_darkness = 0.15
}

# ---------------------------------------------------------
# VOIDBOUND NOVA
# ---------------------------------------------------------

label {
    monitor =
    text = VOIDBOUND NOVA

    font_family = JetBrainsMono Nerd Font
    font_size = 18
    color = rgba(210, 190, 255, 0.92)

    position = 0, 245
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Clock
# ---------------------------------------------------------

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"

    font_family = JetBrainsMono Nerd Font
    font_size = 66
    color = rgba(245, 242, 255, 1.0)

    position = 0, 115
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Date
# ---------------------------------------------------------

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"

    font_family = JetBrainsMono Nerd Font
    font_size = 15
    color = rgba(215, 210, 230, 0.88)

    position = 0, 45
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Password
# ---------------------------------------------------------

input-field {
    monitor =

    size = 300, 48
    outline_thickness = 2

    dots_size = 0.20
    dots_spacing = 0.28
    dots_center = true

    outer_color = rgba(165, 120, 255, 0.80)
    inner_color = rgba(20, 17, 30, 0.72)
    font_color = rgba(245, 242, 255, 1.0)

    fade_on_empty = false

    placeholder_text = <span foreground="##b9adc9">Enter password</span>
    fail_text = <span foreground="##ff7a90">$FAIL</span>

    hide_input = false
    rounding = 12

    position = 0, -60
    halign = center
    valign = center
}

# ---------------------------------------------------------
# User
# ---------------------------------------------------------

label {
    monitor =
    text = zerotrace

    font_family = JetBrainsMono Nerd Font
    font_size = 14
    color = rgba(205, 197, 220, 0.80)

    position = 0, -125
    halign = center
    valign = center
}

# ---------------------------------------------------------
# Small footer
# ---------------------------------------------------------

label {
    monitor =
    text = voidbound-nova

    font_family = JetBrainsMono Nerd Font
    font_size = 10
    color = rgba(185, 170, 205, 0.55)

    position = 0, 22
    halign = center
    valign = bottom
}
